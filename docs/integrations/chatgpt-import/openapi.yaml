openapi: 3.1.0
info:
  title: Quiz TSI — import de brouillons privés
  version: 1.0.0
  description: Crée uniquement des brouillons privés après confirmation explicite.
servers:
  - url: https://PROJECT_REF.supabase.co/functions/v1
paths:
  /gpt-question-import:
    post:
      operationId: importQuestionDrafts
      summary: Importer des brouillons privés Quiz TSI
      security: [{ quizTsiOAuth: [email] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatGptQuestionImportV1' }
      responses:
        '200':
          description: Rapport d’import, y compris lors d’un replay identique.
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/ImportReportV1' } },
            }
        '409': { description: importId déjà utilisé avec un autre payload. }
        '422': { description: Payload non fiable ou aucune entrée acceptée. }
components:
  securitySchemes:
    quizTsiOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://PROJECT_REF.supabase.co/functions/v1/gpt-oauth-authorize
          tokenUrl: https://PROJECT_REF.supabase.co/functions/v1/gpt-oauth-token
          scopes: { email: Identifier le compte Quiz TSI }
  schemas:
    MathSource:
      {
        type: object,
        additionalProperties: false,
        required: [syntaxVersion, source],
        properties:
          {
            syntaxVersion: { const: 1 },
            source: { type: string, maxLength: 20000 },
          },
      }
    ContentSegment:
      oneOf:
        - {
            type: object,
            additionalProperties: false,
            required: [kind, value],
            properties:
              {
                kind: { const: text },
                value: { type: string, maxLength: 20000 },
              },
          }
        - {
            type: object,
            additionalProperties: false,
            required: [kind, math],
            properties:
              {
                kind: { enum: [inline-math, display-math] },
                math: { $ref: '#/components/schemas/MathSource' },
              },
          }
        - {
            type: object,
            additionalProperties: false,
            required: [kind],
            properties: { kind: { const: line-break } },
          }
    Classification:
      type: object
      additionalProperties: false
      required:
        [
          kind,
          proposedCourseTitle,
          proposedChapterTitle,
          reason,
          requiresUserConfirmation,
        ]
      properties:
        {
          kind: { const: personal },
          proposedCourseTitle: { type: string, maxLength: 200 },
          proposedChapterTitle: { type: [string, 'null'], maxLength: 200 },
          reason: { type: string, maxLength: 20000 },
          requiresUserConfirmation: { const: true },
        }
    ChatGptQuestionImportV1:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          importId,
          analysisCoverage,
          confirmedByUser,
          document,
          questions,
        ]
      properties:
        schemaVersion: { const: 1 }
        importId: { type: string, maxLength: 200 }
        analysisCoverage: { enum: [text-and-visuals, text-only, incomplete] }
        confirmedByUser: { const: true }
        document:
          {
            type: object,
            additionalProperties: false,
            required: [kind, title, pageCount],
            properties:
              {
                kind: { enum: [photo, pdf, direct-entry] },
                title: { type: [string, 'null'] },
                pageCount: { type: [integer, 'null'], minimum: 0 },
              },
          }
        questions:
          {
            type: array,
            maxItems: 100,
            items: { $ref: '#/components/schemas/ImportQuestion' },
          }
    ImportQuestion:
      type: object
      additionalProperties: false
      required:
        [
          clientEntryId,
          classification,
          type,
          difficulty,
          parameterization,
          prompt,
          hint,
          correction,
          tags,
          uncertainties,
        ]
      properties:
        clientEntryId: { type: [string, 'null'], maxLength: 200 }
        classification: { $ref: '#/components/schemas/Classification' }
        type:
          {
            enum: [formula, course, calculation, reflex],
            description: 'formula = restitution d’une formule ou d’un résultat à mémoriser ; course = question de cours théorique ; calculation = un calcul à mener ; reflex = question rapide chronométrée, toujours avec difficulty=null. Ne jamais inventer un autre type (ex. "open-ended", "short-answer").',
          }
        difficulty:
          {
            enum: [fundamental, standard, trap, null],
            description: 'fundamental = notion de base ; standard = niveau normal ; trap = piège destiné à repérer une erreur classique. Toujours null quand type=reflex, jamais null sinon. Ne jamais inventer une autre valeur (ex. "easy", "medium", "hard").',
          }
        parameterization: { type: 'null' }
        prompt:
          {
            type: array,
            maxItems: 100,
            items: { $ref: '#/components/schemas/ContentSegment' },
          }
        hint:
          {
            type: array,
            maxItems: 100,
            items: { $ref: '#/components/schemas/ContentSegment' },
          }
        correction:
          {
            type: array,
            maxItems: 30,
            items: { $ref: '#/components/schemas/CorrectionStep' },
          }
        tags:
          { type: array, maxItems: 30, items: { type: string, maxLength: 200 } }
        uncertainties:
          {
            type: array,
            maxItems: 30,
            items:
              {
                type: object,
                additionalProperties: false,
                required: [code, path, message],
                properties:
                  {
                    code:
                      {
                        enum:
                          [
                            ocr,
                            formula,
                            classification,
                            text-visual-conflict,
                            missing-visual-analysis,
                          ],
                      },
                    path: { type: string, maxLength: 500 },
                    message: { type: string, maxLength: 1000 },
                  },
              },
          }
    CorrectionStep:
      type: object
      additionalProperties: false
      required: [title, content]
      properties:
        title: { type: [string, 'null'], maxLength: 500 }
        content:
          {
            type: array,
            minItems: 1,
            maxItems: 100,
            items: { $ref: '#/components/schemas/ContentSegment' },
          }
    ImportReportV1:
      type: object
      additionalProperties: false
      required:
        [schemaVersion, importId, accepted, quarantined, warnings, replayed]
      properties:
        {
          schemaVersion: { const: 1 },
          importId: { type: string },
          accepted: { type: array, items: { type: integer } },
          quarantined:
            {
              type: array,
              items: { $ref: '#/components/schemas/ReportEntry' },
            },
          warnings:
            {
              type: array,
              items: { $ref: '#/components/schemas/ReportEntry' },
            },
          replayed: { type: boolean },
        }
    ReportEntry:
      {
        type: object,
        additionalProperties: false,
        required: [index, code, path, message],
        properties:
          {
            index: { type: integer },
            code: { type: string },
            path: { type: string },
            message: { type: string },
          },
      }
